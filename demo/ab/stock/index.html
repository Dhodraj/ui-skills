<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen · Data Observability</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f3f0; --hover:rgba(11,11,11,.045);
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.12);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5a00; --serious-ink:#a8461f; --crit-ink:#b02a2a;
  --running:#2a78d6; --skipped:#c3c2b7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222220; --hover:rgba(255,255,255,.05);
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.18);
    --good-ink:#0ca30c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e66767;
    --running:#3987e5; --skipped:#4a4a46;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222220; --hover:rgba(255,255,255,.05);
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.18);
  --good-ink:#0ca30c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e66767;
  --running:#3987e5; --skipped:#4a4a46;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
/* sidebar */
.side{border-right:1px solid var(--border);background:var(--surface);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:650;font-size:15px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);text-align:left}
.nav-btn:hover{background:var(--hover);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav-btn svg{flex:none;opacity:.8}
.nav-btn .count{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--critical);color:#fff}
.side-foot{margin-top:auto;padding:8px 10px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5}
.topbar h1{font-size:16px;margin:0;font-weight:650}
.topbar .sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.btn{border:1px solid var(--border);background:var(--surface);padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.env{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--good)}
.content{padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g2e{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2{font-size:13px;margin:0;font-weight:650}
.card-h .hint{color:var(--muted);font-size:12px}
.tile .label{color:var(--ink-2);font-size:12px}
.tile .value{font-size:28px;font-weight:650;margin:4px 0 2px;letter-spacing:-.01em}
.tile .delta{font-size:12px;color:var(--muted)}
.tile .delta.bad{color:var(--crit-ink)} .tile .delta.good{color:var(--good-ink)}
/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;white-space:nowrap}
.pill i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none}
.pill.good i{background:var(--good)} .pill.good{color:var(--good-ink)}
.pill.warning i{background:var(--warning);color:#0b0b0b} .pill.warning{color:var(--warn-ink)}
.pill.serious i{background:var(--serious)} .pill.serious{color:var(--serious-ink)}
.pill.critical i{background:var(--critical)} .pill.critical{color:var(--crit-ink)}
.pill.running i{background:var(--running)} .pill.running{color:var(--accent)}
.pill.muted i{background:var(--skipped);color:var(--ink)} .pill.muted{color:var(--muted)}
.sev{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff;white-space:nowrap}
.sev.s1{background:var(--critical)} .sev.s2{background:var(--serious)} .sev.s3{background:var(--warning);color:#0b0b0b}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);white-space:nowrap}
/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:550;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;user-select:none}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)}
tr.sel td{background:var(--accent-soft)!important}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.scroll-x{overflow-x:auto}
/* run strip */
.strip{display:flex;gap:2px;align-items:flex-end;height:18px}
.strip b{width:6px;height:18px;border-radius:2px;display:block;flex:none}
.strip b.success{background:var(--good)} .strip b.failed{background:var(--critical)} .strip b.running{background:var(--running)} .strip b.skipped{background:var(--skipped)}
.strip b.failed{height:18px} .strip b.success{height:12px}
/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--grid);cursor:pointer;border-radius:6px}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{color:var(--muted);font-size:12px}
.li .grow{flex:1;min-width:0}
/* tooltip */
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;min-width:140px;max-width:320px;opacity:0;transition:opacity .08s}
#tip .tt{font-weight:650;margin-bottom:4px}
#tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .row span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .row b{font-variant-numeric:tabular-nums;font-weight:600}
/* charts */
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.axis-t{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.gridl{stroke:var(--grid);stroke-width:1}
.basel{stroke:var(--axis);stroke-width:1}
/* lineage */
.lin-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media (max-width:1200px){.lin-wrap{grid-template-columns:1fr}}
.lin-svg{width:100%;min-width:980px;display:block}
.lnode{cursor:pointer}
.lnode rect.box{fill:var(--surface);stroke:var(--border);stroke-width:1}
.lnode:hover rect.box{stroke:var(--accent)}
.lnode.sel rect.box{stroke:var(--accent);stroke-width:2}
.lnode text.n{fill:var(--ink);font-size:12px;font-weight:550}
.lnode text.m{fill:var(--muted);font-size:10.5px}
.ledge{fill:none;stroke:var(--axis);stroke-width:1.5}
.ledge.hi{stroke:var(--accent);stroke-width:2}
.dim .lnode:not(.hi){opacity:.28}
.dim .ledge:not(.hi){opacity:.25}
.layer-h{fill:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
input.search,select{font:inherit;font-size:12px;padding:5px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink)}
input.search{width:220px}
/* freshness bar */
.fbar{position:relative;height:8px;width:160px;background:var(--surface-2);border-radius:4px;border:1px solid var(--border)}
.fbar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.fbar em{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
/* incidents */
.inc-wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.inc-wrap{grid-template-columns:1fr}}
.inc-item{padding:12px;border-bottom:1px solid var(--grid);cursor:pointer;display:flex;flex-direction:column;gap:6px;border-radius:8px}
.inc-item:hover{background:var(--hover)}
.inc-item.sel{background:var(--accent-soft)}
.inc-item .row1{display:flex;align-items:center;gap:8px}
.inc-item .ttl{font-weight:600}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--grid)}
.timeline li{position:relative;padding:0 0 14px 4px}
.timeline li::before{content:"";position:absolute;left:-25px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--axis)}
.timeline li.k-detect::before{border-color:var(--critical)}
.timeline li.k-resolve::before{border-color:var(--good);background:var(--good)}
.timeline li.k-ack::before{border-color:var(--accent)}
.timeline .when{color:var(--muted);font-size:11px}
.err{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--critical);padding:8px 10px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;color:var(--ink-2)}
.empty{color:var(--muted);padding:24px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
textarea{font:inherit;font-size:12px;width:100%;min-height:60px;padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.brand{padding-bottom:4px}.side-foot{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="3" cy="7" r="2" fill="#fff"/><circle cx="11" cy="3" r="2" fill="#fff"/><circle cx="11" cy="11" r="2" fill="#fff"/><path d="M5 7 9 3.5M5 7l4 3.5" stroke="#fff" stroke-width="1.4"/></svg></div>
      <div>Lumen<small>Data observability</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">Workspace <b>acme-analytics</b><br>Warehouse: Snowflake · PROD</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="title">Overview</h1><div class="sub" id="subtitle"></div></div>
      <div class="spacer"></div>
      <span class="env"><span class="dot"></span>prod</span>
      <div class="seg" id="range" role="group" aria-label="Time range">
        <button data-r="24h" aria-pressed="true">Last 24h</button><button data-r="7d" aria-pressed="false">Last 7d</button>
      </div>
      <button class="btn" id="theme" title="Toggle theme" aria-label="Toggle light/dark theme">◐ Theme</button>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function(){
"use strict";
/* ---------------- utilities ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
var rng = mulberry32(20261101);
var MIN=60000, HR=60*MIN, DAY=24*HR;
var NOW = Math.floor(Date.now()/MIN)*MIN;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmtDur(ms){if(ms==null)return"—";var s=Math.round(ms/1000);if(s<60)return s+"s";var m=Math.floor(s/60);if(m<60)return m+"m "+String(s%60).padStart(2,"0")+"s";var h=Math.floor(m/60);if(h<48)return h+"h "+String(m%60).padStart(2,"0")+"m";return Math.floor(h/24)+"d "+(h%24)+"h";}
function fmtLag(ms){var m=Math.round(ms/MIN);if(m<1)return"just now";if(m<60)return m+"m";var h=Math.floor(m/60);if(h<48)return h+"h"+(m%60?" "+String(m%60).padStart(2,"0")+"m":"");return Math.floor(h/24)+"d "+(h%24)+"h";}
function ago(t){return fmtLag(NOW-t).trim()+(NOW-t<MIN?"":" ago");}
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function p2(n){return String(n).padStart(2,"0");}
function hm(t){var d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes());}
function fmtTime(t){var d=new Date(t), today=new Date(NOW);var same=d.toDateString()===today.toDateString();return (same?"Today":DOW[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate())+", "+hm(t);}
function fmtInt(n){return n.toLocaleString("en-US");}
function niceStep(max,count){var raw=max/count;var mag=Math.pow(10,Math.floor(Math.log10(raw||1)));var r=raw/mag;var s=r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10;return s*mag;}
function el(id){return document.getElementById(id);}

/* ---------------- tooltip ---------------- */
var tip=el("tip");
function showTip(html,ev){tip.innerHTML=html;tip.style.opacity=1;moveTip(ev);}
function moveTip(ev){var w=tip.offsetWidth,h=tip.offsetHeight,x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.style.opacity=0;}
function tipRow(label,val,color){return '<div class="row"><span>'+(color?'<i class="sw" style="background:'+color+'"></i>':'')+esc(label)+'</span><b>'+esc(val)+'</b></div>';}

/* ---------------- static model ---------------- */
var LAYERS=["Sources","Staging","Intermediate","Marts","Exposures"];
var OWNERS={core:"data-platform",fin:"finance-analytics",growth:"growth-analytics",ml:"ml-platform",ops:"revops"};
var PIPELINES=[
 {id:"ingest_postgres_app",name:"ingest_postgres_app",tool:"Fivetran",schedule:"Hourly",every:60,off:5,dur:6,fail:.01,owner:OWNERS.core},
 {id:"ingest_stripe",name:"ingest_stripe",tool:"Airbyte",schedule:"Hourly",every:60,off:10,dur:4,fail:.015,owner:OWNERS.fin},
 {id:"ingest_segment",name:"ingest_segment",tool:"Segment → S3 → Snowpipe",schedule:"Hourly",every:60,off:0,dur:9,fail:.01,owner:OWNERS.growth},
 {id:"ingest_hubspot",name:"ingest_hubspot",tool:"Fivetran",schedule:"Every 6h",every:360,off:15,dur:12,fail:.02,owner:OWNERS.ops},
 {id:"dbt_hourly",name:"dbt_hourly",tool:"dbt Cloud",schedule:"Hourly at :20",every:60,off:20,dur:11,fail:.012,owner:OWNERS.core},
 {id:"dbt_daily",name:"dbt_daily",tool:"dbt Cloud",schedule:"Daily 02:00",every:1440,off:120,dur:38,fail:0,owner:OWNERS.core},
 {id:"ml_features",name:"ml_features",tool:"Airflow",schedule:"Daily 04:00",every:1440,off:240,dur:52,fail:0,owner:OWNERS.ml},
 {id:"bi_refresh",name:"bi_refresh",tool:"Looker PDT",schedule:"Hourly at :45",every:60,off:45,dur:3,fail:.008,owner:OWNERS.fin},
 {id:"reverse_etl_hubspot",name:"reverse_etl_hubspot",tool:"Hightouch",schedule:"Every 6h",every:360,off:60,dur:8,fail:.02,owner:OWNERS.ops}
];
var PMAP={};PIPELINES.forEach(function(p){PMAP[p.id]=p;});
// tables: id, layer, pipeline, sla (minutes), owner, rows
var NODES=[
 ["raw.postgres.users",0,"ingest_postgres_app",90,OWNERS.core,4.82e6,"table"],
 ["raw.postgres.orders",0,"ingest_postgres_app",90,OWNERS.core,31.4e6,"table"],
 ["raw.postgres.order_items",0,"ingest_postgres_app",90,OWNERS.core,88.1e6,"table"],
 ["raw.stripe.charges",0,"ingest_stripe",90,OWNERS.fin,12.7e6,"table"],
 ["raw.stripe.refunds",0,"ingest_stripe",90,OWNERS.fin,0.41e6,"table"],
 ["raw.segment.events",0,"ingest_segment",90,OWNERS.growth,2.31e9,"table"],
 ["raw.hubspot.contacts",0,"ingest_hubspot",480,OWNERS.ops,1.9e6,"table"],
 ["stg_users",1,"dbt_hourly",150,OWNERS.core,4.82e6,"view"],
 ["stg_orders",1,"dbt_hourly",150,OWNERS.core,31.4e6,"view"],
 ["stg_order_items",1,"dbt_hourly",150,OWNERS.core,88.1e6,"view"],
 ["stg_payments",1,"dbt_hourly",150,OWNERS.fin,13.1e6,"view"],
 ["stg_events",1,"dbt_hourly",150,OWNERS.growth,2.31e9,"incremental"],
 ["stg_contacts",1,"dbt_hourly",540,OWNERS.ops,1.9e6,"view"],
 ["int_order_revenue",2,"dbt_daily",1560,OWNERS.fin,31.2e6,"table"],
 ["int_sessions",2,"dbt_hourly",150,OWNERS.growth,412e6,"incremental"],

/* ---------------- freshness (data watermark propagation) ---------------- */
function computeFreshness(){
  var memo={};
  function wm(id){
    if(memo[id]!=null)return memo[id];
    var n=NMAP[id], ls=lastSuccess(n.pipeline), own=ls?ls.end:START;
    var w=own;
    // a downstream table cannot be fresher than what it last read: cap by upstream watermark at its own run
    n.up.forEach(function(u){w=Math.min(w,wm(u));});
    memo[id]=w;n.watermark=w;n.lastRun=own;return w;
  }
  NODES.forEach(function(n){wm(n.id);});
  NODES.forEach(function(n){
    n.lag=NOW-n.watermark;
    n.ratio=n.lag/n.sla;
    n.fstatus = n.ratio>1 ? "stale" : n.ratio>0.8 ? "warning" : "fresh";
  });
  // propagate "at risk": upstream stale => at least warning
  NODES.slice().sort(function(a,b){return a.layer-b.layer;}).forEach(function(n){
    n.atRisk = n.fstatus==="fresh" && n.up.some(function(u){return NMAP[u].fstatus==="stale"||NMAP[u].atRisk;});
    if(n.atRisk) n.fstatus="warning";
  });
}

function bucketRuns(){
  var size=state.range==="24h"?HR:6*HR, n=state.range==="24h"?24:28;
  var end=Math.ceil(NOW/size)*size, start=end-n*size, b=[];
  for(var i=0;i<n;i++)b.push({t:start+i*size,size:size,success:0,failed:0,running:0});
  RUNS.forEach(function(r){if(r.start<start)return;var i=Math.floor((r.start-start)/size);if(b[i])b[i][r.status]++;});
  return b;
}
function drawRunsChart(host){

    host.innerHTML='<div class="scroll-x" style="max-height:260px;overflow-y:auto"><table><thead><tr><th>Window start</th><th class="num">Succeeded</th><th class="num">Failed</th><th class="num">Running</th></tr></thead><tbody>'+
      b.slice().reverse().map(function(x){return '<tr><td>'+fmtTime(x.t)+'</td><td class="num">'+x.success+'</td><td class="num">'+x.failed+'</td><td class="num">'+x.running+'</td></tr>';}).join("")+'</tbody></table></div>';

  }

  for(var v=0;v<=top+1e-9;v+=step){var y=mt+ih-v/top*ih;s+='<line class="'+(v===0?"basel":"gridl")+'" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'"/><text class="axis-t" x="'+(ml-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>';}
  var order=["success","failed","running"];
  b.forEach(function(x,i){
    var cx=ml+i*bw+bw/2, y0=mt+ih, segs=order.filter(function(k){return x[k]>0;});
    segs.forEach(function(k,j){
      var hgt=x[k]/top*ih, isTop=j===segs.length-1, gap=j>0?2:0;

    s+='<rect class="hit" data-i="'+i+'" x="'+(ml+i*bw)+'" y="'+mt+'" width="'+bw+'" height="'+ih+'" fill="transparent"/>';
  });

      showTip('<div class="tt">'+fmtTime(x.t)+' – '+hm(x.t+x.size)+'</div>'+order.map(function(k){return tipRow(RSTAT[k].label,x[k],RSTAT[k].color);}).join("")+'<div class="row" style="border-top:1px solid var(--grid);margin-top:4px;padding-top:4px"><span>Total</span><b>'+(x.success+x.failed+x.running)+'</b></div>',ev);});
    r.addEventListener("mouseleave",function(){hl.setAttribute("opacity",0);hideTip();});
  });

function roundTop(x,y,w,h,r){return "M"+x+","+(y+h)+"V"+(y+r)+"Q"+x+","+y+" "+(x+r)+","+y+"H"+(x+w-r)+"Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+"V"+(y+h)+"Z";}
function roundRight(x,y,w,h,r){r=Math.min(r,w/2);return "M"+x+","+y+"H"+(x+w-r)+"Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+"V"+(y+h-r)+"Q"+(x+w)+","+(y+h)+" "+(x+w-r)+","+(y+h)+"H"+x+"Z";}

function drawDurChart(host,pid){
  var from=NOW-rangeMs();
  var rs=runsOf(pid).filter(function(r){return r.start>=from&&r.status!=="running";}).sort(function(a,b){return a.start-b.start;});
  if(rs.length<2){host.innerHTML='<div class="empty">Not enough runs in range</div>';return;}
  var W=Math.max(host.clientWidth,320),H=220,ml=52,mr=12,mt=12,mb=24,iw=W-ml-mr,ih=H-mt-mb;
  var maxD=Math.max.apply(null,rs.map(function(r){return r.dur;}))/MIN;var step=niceStep(maxD,4),top=Math.ceil(maxD/step)*step||1;
  function X(t){return ml+(t-from)/(NOW-from)*iw;} function Y(d){return mt+ih-d/MIN/top*ih;}
  var ok=rs.filter(function(r){return r.status==="success";}).map(function(r){return r.dur;}).sort(function(a,b){return a-b;});
  var p50=ok.length?ok[Math.floor(ok.length/2)]:null;
  var s='<svg width="'+W+'" height="'+H+'" role="img" aria-label="Line chart of run duration over time">';
  for(var v=0;v<=top+1e-9;v+=step){var y=mt+ih-v/top*ih;s+='<line class="'+(v===0?"basel":"gridl")+'" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'"/><text class="axis-t" x="'+(ml-6)+'" y="'+(y+4)+'" text-anchor="end">'+(v<1?Math.round(v*60)+"s":(+v.toFixed(1))+"m")+'</text>';}
  var tickN=state.range==="24h"?6:7;for(var i=0;i<=tickN;i++){var t=from+(NOW-from)*i/tickN;var d=new Date(t);s+='<text class="axis-t" x="'+X(t)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===tickN?"end":"middle")+'">'+(state.range==="24h"?hm(t):DOW[d.getDay()]+" "+d.getDate())+'</text>';}
  if(p50){s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(p50)+'" y2="'+Y(p50)+'" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="'+(W-mr)+'" y="'+(Y(p50)-5)+'" text-anchor="end" class="axis-t">p50 '+fmtDur(p50)+'</text>';}
  s+='<path d="'+rs.map(function(r,i){return (i?"L":"M")+X(r.start).toFixed(1)+","+Y(r.dur).toFixed(1);}).join("")+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>';
  rs.forEach(function(r){if(r.status==="failed"){var x=X(r.start),y=Y(r.dur);s+='<circle cx="'+x+'" cy="'+y+'" r="6" fill="var(--critical)" stroke="var(--surface)" stroke-width="2"/><path d="M'+(x-2.5)+','+(y-2.5)+'l5,5M'+(x+2.5)+','+(y-2.5)+'l-5,5" stroke="#fff" stroke-width="1.5"/>';}});
  s+='<g id="dcH" opacity="0"><line id="dcL" y1="'+mt+'" y2="'+(mt+ih)+'" stroke="var(--axis)"/><circle id="dcC" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>';
  s+='<rect id="dcHit" x="'+ml+'" y="'+mt+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';
  host.innerHTML=s;
  var g=host.querySelector("#dcH"),L=host.querySelector("#dcL"),C=host.querySelector("#dcC"),hit=host.querySelector("#dcHit");
  hit.addEventListener("mousemove",function(ev){
    var bx=hit.getBoundingClientRect(), mx=ev.clientX-bx.left+ml, best=rs[0], bd=1e9;
    rs.forEach(function(r){var d=Math.abs(X(r.start)-mx);if(d<bd){bd=d;best=r;}});
    var x=X(best.start),y=Y(best.dur);L.setAttribute("x1",x);L.setAttribute("x2",x);C.setAttribute("cx",x);C.setAttribute("cy",y);C.setAttribute("fill",best.status==="failed"?"var(--critical)":"var(--s1)");g.setAttribute("opacity",1);
    showTip('<div class="tt">'+fmtTime(best.start)+'</div>'+tipRow("Duration",fmtDur(best.dur))+tipRow("Status",RSTAT[best.status].label)+(p50?tipRow("vs p50",(best.dur>=p50?"+":"")+Math.round((best.dur/p50-1)*100)+"%"):"")+'<div class="muted mono" style="margin-top:4px;font-size:11px">'+best.id+'</div>',ev);
  });
  hit.addEventListener("mouseleave",function(){g.setAttribute("opacity",0);hideTip();});
}

var NW=214,NH=46,COLGAP=70,ROWGAP=16,PADT=34;
function layout(){
  var cols=LAYERS.map(function(){return [];});
  NODES.forEach(function(n){cols[n.layer].push(n);});
  var maxRows=Math.max.apply(null,cols.map(function(c){return c.length;}));
  var totalH=maxRows*(NH+ROWGAP)-ROWGAP;
  cols.forEach(function(c,ci){var h=c.length*(NH+ROWGAP)-ROWGAP,off=(totalH-h)/2;c.forEach(function(n,ri){n.x=ci*(NW+COLGAP);n.y=PADT+off+ri*(NH+ROWGAP);});});
  return {W:LAYERS.length*(NW+COLGAP)-COLGAP,H:PADT+totalH+8};
}

    svg.querySelectorAll(".ledge").forEach(function(p){var a=p.dataset.a,b=p.dataset.b;p.classList.toggle("hi",(on[a]&&on[b])&&((up[a]||a===id)&&(up[b]||b===id)||(dn[a]||a===id)&&(dn[b]||b===id)));});
  }
  svg.querySelectorAll(".lnode").forEach(function(g){
    var n=NMAP[g.dataset.id];
    g.addEventListener("click",function(){state.node=n.id;highlight(n.id);renderSide();});
    g.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();state.node=n.id;highlight(n.id);renderSide();}});
    g.addEventListener("mouseenter",function(ev){highlight(n.id);});
    g.addEventListener("mousemove",function(ev){showTip('<div class="tt mono">'+esc(n.id)+'</div>'+tipRow("Status",FSTAT[n.fstatus].label)+tipRow("Data age",fmtLag(n.lag))+tipRow("SLA",fmtLag(n.sla))+tipRow("Upstream",Object.keys(walk(n.id,"up")).length)+tipRow("Downstream",Object.keys(walk(n.id,"down")).length),ev);});
    g.addEventListener("mouseleave",function(){hideTip();highlight(state.node);});
  });
  function renderSide(){
    var n=NMAP[state.node],p=PMAP[n.pipeline],ls=lastSuccess(p.id),pr=pipeStats(p.id);
    var up=Object.keys(walk(n.id,"up")),dn=Object.keys(walk(n.id,"down"));
    var incs=INCIDENTS.filter(function(i){return i.assets.indexOf(n.id)>=0;});
    var staleUp=up.filter(function(u){return NMAP[u].fstatus==="stale";});
    el("linSide").innerHTML='<div style="border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-2)">'+
      '<div class="mono" style="font-weight:650;font-size:13px;overflow-wrap:anywhere">'+esc(n.id)+'</div><div style="margin:6px 0 12px;display:flex;gap:8px;align-items:center">'+pill(FSTAT,n.fstatus)+'<span class="tag">'+n.kind+'</span><span class="tag">'+LAYERS[n.layer]+'</span></div>'+
      (n.atRisk?'<div class="err" style="border-left-color:var(--warning);font-family:inherit;margin-bottom:12px">Own SLA is met, but upstream '+staleUp.map(function(u){return '<b class="mono">'+esc(u)+'</b>';}).join(", ")+' '+(staleUp.length>1?"are":"is")+' stale. Expect a breach on the next build.</div>':'')+
      '<dl class="kv"><dt>Data age</dt><dd>'+fmtLag(n.lag)+' <span class="muted">(watermark '+fmtTime(n.watermark)+')</span></dd><dt>Freshness SLA</dt><dd>'+fmtLag(n.sla)+' · '+Math.round(n.ratio*100)+'% used</dd>'+
      '<dt>Built by</dt><dd><a class="mono" data-pipe="'+p.id+'">'+p.name+'</a> '+pill(RSTAT,pr.last.status,"")+'</dd><dt>Last success</dt><dd>'+(ls?fmtTime(ls.end):"—")+'</dd><dt>Owner</dt><dd>'+n.owner+'</dd>'+
      (n.rows?'<dt>Rows</dt><dd>'+fmtInt(Math.round(n.rows))+'</dd>':'')+
      '<dt>Upstream</dt><dd>'+(up.length?up.length+' assets':'— (source)')+'</dd><dt>Downstream</dt><dd>'+(dn.length?dn.length+' assets':'— (leaf)')+'</dd></dl>'+
      (incs.length?'<h3 style="font-size:12px;margin:14px 0 6px">Incidents</h3>'+incs.map(function(i){return '<div class="li" data-inc="'+i.id+'" style="padding:6px 4px">'+sevBadge(i.sev)+'<div class="grow"><div class="t" style="font-size:12px">'+esc(i.title)+'</div><div class="s">'+i.id+' · '+i.status+'</div></div></div>';}).join(""):'')+
      (dn.length?'<h3 style="font-size:12px;margin:14px 0 6px">Downstream impact</h3><div class="chips">'+dn.map(function(d){return '<button class="chip" data-sel="'+esc(d)+'">'+esc(d)+'</button>';}).join("")+'</div>':'')+
      (up.length?'<h3 style="font-size:12px;margin:14px 0 6px">Upstream</h3><div class="chips">'+up.map(function(d){return '<button class="chip" data-sel="'+esc(d)+'">'+esc(d)+'</button>';}).join("")+'</div>':'')+
      '</div>';
    bindListLinks(el("linSide"));
    el("linSide").querySelectorAll("[data-sel]").forEach(function(c){c.onclick=function(){state.node=c.dataset.sel;highlight(state.node);renderSide();};});
  }
  highlight(state.node);renderSide();
}
var _mctx;function measure(t){_mctx=_mctx||document.createElement("canvas").getContext("2d");_mctx.font='10.5px system-ui,-apple-system,"Segoe UI",sans-serif';return _mctx.measureText(t).width;}

/* ---------------- FRESHNESS ---------------- */
function renderFreshness(){
  var f=state.fresh;
  var counts={fresh:0,warning:0,stale:0};NODES.forEach(function(n){counts[n.fstatus]++;});
  var h='<div class="grid g4">'+tile("Fresh",String(counts.fresh),"within SLA","good")+tile("At risk",String(counts.warning),">80% of SLA or stale upstream",counts.warning?"bad":"")+tile("Stale",String(counts.stale),"SLA breached",counts.stale?"bad":"good")+
    tile("Worst lag vs SLA",Math.round(Math.max.apply(null,NODES.map(function(n){return n.ratio;}))*100)+"%",esc(NODES.slice().sort(function(a,b){return b.ratio-a.ratio;})[0].id),"")+'</div>';
  h+='<div class="card"><div class="card-h" style="flex-wrap:wrap"><h2>Assets</h2><span class="spacer"></span>'+
    '<input class="search" id="fq" type="search" placeholder="Filter by name or owner…" value="'+esc(f.q)+'" aria-label="Filter tables">'+
    '<select id="fl" aria-label="Layer"><option value="all">All layers</option>'+LAYERS.map(function(L,i){return '<option value="'+i+'"'+(f.layer===String(i)?" selected":"")+'>'+L+'</option>';}).join("")+'</select>'+
    '<div class="chips" id="fs">'+["all","stale","warning","fresh"].map(function(k){return '<button class="chip" data-s="'+k+'" aria-pressed="'+(f.status===k)+'">'+(k==="all"?"All":FSTAT[k].label)+'</button>';}).join("")+'</div></div>'+
    '<div class="scroll-x" id="ftable"></div></div>';
  el("view").innerHTML=h;
  drawFreshTable();
  el("fq").oninput=function(){f.q=this.value;drawFreshTable();};
  el("fl").onchange=function(){f.layer=this.value;drawFreshTable();};
  el("fs").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;f.status=b.dataset.s;this.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c===b);});drawFreshTable();};
}
function drawFreshTable(){
  var f=state.fresh,q=f.q.trim().toLowerCase();
  var rows=NODES.filter(function(n){return (f.layer==="all"||String(n.layer)===f.layer)&&(f.status==="all"||n.fstatus===f.status)&&(!q||n.id.toLowerCase().indexOf(q)>=0||n.owner.indexOf(q)>=0);});
  var key={id:function(n){return n.id;},layer:function(n){return n.layer;},owner:function(n){return n.owner;},updated:function(n){return n.watermark;},lag:function(n){return n.lag;},sla:function(n){return n.sla;},ratio:function(n){return n.ratio+(n.fstatus==="warning"?0.001:0);}}[f.sort];
  rows.sort(function(a,b){var x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*f.dir;});
  function th(k,label,num){return '<th class="sort'+(num?" num":"")+'" data-k="'+k+'" aria-sort="'+(f.sort===k?(f.dir>0?"ascending":"descending"):"none")+'">'+label+(f.sort===k?(f.dir>0?" ▲":" ▼"):"")+'</th>';}
  var col={fresh:"var(--good)",warning:"var(--warning)",stale:"var(--critical)"};
  var h='<table><thead><tr>'+th("id","Asset")+th("layer","Layer")+th("owner","Owner")+'<th>Built by</th>'+th("updated","Data as of")+th("lag","Age",1)+th("sla","SLA",1)+th("ratio","Age vs SLA")+'<th>Status</th></tr></thead><tbody>'+
    (rows.length?rows.map(function(n){var w=Math.min(n.ratio,2)/2*100;
      return '<tr class="click" data-node="'+esc(n.id)+'"><td class="mono" style="font-weight:600">'+esc(n.id)+'</td><td class="ink2">'+LAYERS[n.layer]+'</td><td class="ink2">'+n.owner+'</td><td class="mono ink2">'+n.pipeline+'</td><td>'+fmtTime(n.watermark)+'</td><td class="num">'+fmtLag(n.lag)+'</td><td class="num">'+fmtLag(n.sla)+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="fbar" data-r="'+esc(n.id)+'"><span style="width:'+w+'%;background:'+col[n.fstatus]+'"></span><em title="SLA"></em></div><span class="num muted" style="font-size:11px;min-width:38px">'+Math.round(n.ratio*100)+'%</span></div></td><td>'+pill(FSTAT,n.fstatus)+'</td></tr>';}).join(""):'<tr><td colspan="9" class="empty">No assets match these filters</td></tr>')+
    '</tbody></table><div class="muted" style="font-size:11px;margin-top:8px">The bar marker shows the SLA (100%). The bar is capped at 200%. Data age is the upstream watermark: an asset is never fresher than its stalest input.</div>';
  var host=el("ftable");host.innerHTML=h;
  host.querySelectorAll("th.sort").forEach(function(t){t.onclick=function(){var k=t.dataset.k;if(f.sort===k)f.dir*=-1;else{f.sort=k;f.dir=(k==="id"||k==="owner"||k==="layer")?1:-1;}drawFreshTable();};});
  host.querySelectorAll(".fbar").forEach(function(b){var n=NMAP[b.dataset.r];b.addEventListener("mousemove",function(ev){showTip('<div class="tt mono">'+esc(n.id)+'</div>'+tipRow("Age",fmtLag(n.lag))+tipRow("SLA",fmtLag(n.sla))+tipRow("Used",Math.round(n.ratio*100)+"%")+(n.atRisk?'<div class="muted" style="margin-top:4px">Upstream asset is stale</div>':''),ev);});b.addEventListener("mouseleave",hideTip);});
  bindListLinks(host);
}

/* ---------------- INCIDENTS ---------------- */
function renderIncidents(){
  var f=state.incFilter;
  var list=INCIDENTS.filter(function(i){return f==="all"||(f==="active"?i.status!=="resolved":i.status===f);}).sort(function(a,b){return (a.status==="resolved")-(b.status==="resolved")||a.sev-b.sev||b.opened-a.opened;});
  if(!IMAP[state.incident]||list.indexOf(IMAP[state.incident])<0)state.incident=list[0]&&list[0].id;
  var resolved=INCIDENTS.filter(function(i){return i.resolved;});
  var mttr=resolved.length?resolved.reduce(function(s,i){return s+(i.resolved-i.opened);},0)/resolved.length:0;
  var h='<div class="grid g4">'+tile("Open",String(INCIDENTS.filter(function(i){return i.status==="open";}).length),"needs acknowledgement","")+tile("Acknowledged",String(INCIDENTS.filter(function(i){return i.status==="acknowledged";}).length),"being worked","")+
    tile("Resolved (7d)",String(resolved.length),"","good")+tile("Mean time to resolve",fmtDur(mttr),"last 7 days","")+'</div>';
  h+='<div class="inc-wrap"><div class="card" style="padding:10px"><div class="chips" id="incF" style="padding:4px 4px 10px">'+[["active","Active"],["open","Open"],["acknowledged","Acknowledged"],["resolved","Resolved"],["all","All"]].map(function(x){return '<button class="chip" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>';}).join("")+'</div>'+
    (list.length?list.map(function(i){return '<div class="inc-item'+(i.id===state.incident?" sel":"")+'" data-i="'+i.id+'" tabindex="0"><div class="row1">'+sevBadge(i.sev)+'<span class="mono muted" style="font-size:11px">'+i.id+'</span><span class="spacer" style="flex:1"></span>'+incStatusPill(i.status)+'</div><div class="ttl">'+esc(i.title)+'</div><div class="muted" style="font-size:12px">'+esc(i.type)+' · '+i.assets.length+' assets · opened '+ago(i.opened)+'</div></div>';}).join(""):'<div class="empty">No incidents</div>')+
    '</div><div class="card" id="incDetail"></div></div>';
  el("view").innerHTML=h;
  el("incF").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;state.incFilter=b.dataset.f;renderIncidents();};
  el("view").querySelectorAll(".inc-item").forEach(function(x){var fn=function(){state.incident=x.dataset.i;renderIncidents();};x.onclick=fn;x.onkeydown=function(e){if(e.key==="Enter")fn();};});
  renderIncDetail();
}
function renderIncDetail(){
  var host=el("incDetail"),i=IMAP[state.incident];
  if(!i){host.innerHTML='<div class="empty">Select an incident</div>';return;}
  var p=PMAP[i.pipeline], ps=pipeStats(p.id);
  var h='<div class="card-h" style="align-items:flex-start;flex-wrap:wrap">'+sevBadge(i.sev)+'<div style="flex:1;min-width:240px"><h2 style="font-size:15px">'+esc(i.title)+'</h2><div class="muted" style="font-size:12px;margin-top:2px">'+i.id+' · '+esc(i.type)+' · opened '+fmtTime(i.opened)+(i.resolved?' · resolved after '+fmtDur(i.resolved-i.opened):' · open for '+fmtDur(NOW-i.opened))+'</div></div>'+incStatusPill(i.status)+'</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:14px">'+
      (i.status==="open"?'<button class="btn" id="ack">Acknowledge</button>':'')+(i.status!=="resolved"?'<button class="btn primary" id="res">Mark resolved</button>':'<button class="btn" id="reopen">Reopen</button>')+
      '<a class="btn" data-node="'+esc(i.assets[0])+'" style="text-decoration:none;color:inherit">View in lineage</a></div>'+
    '<p style="margin:0 0 14px;color:var(--ink-2);max-width:72ch">'+esc(i.summary)+'</p>'+
    '<div class="grid g2e"><div><h3 style="font-size:12px;margin:0 0 8px">Details</h3><dl class="kv"><dt>Owner team</dt><dd>'+i.owner+'</dd><dt>Assignee</dt><dd>'+esc(i.assignee)+'</dd><dt>Pipeline</dt><dd><a class="mono" data-pipe="'+p.id+'">'+p.name+'</a> '+pill(RSTAT,ps.last.status)+'</dd><dt>Success rate</dt><dd>'+(ps.rate*100).toFixed(1)+'% ('+(state.range==="24h"?"24h":"7d")+')</dd></dl>'+
    '<h3 style="font-size:12px;margin:16px 0 8px">Affected assets</h3><table><tbody>'+i.assets.map(function(a){var n=NMAP[a];return '<tr class="click" data-node="'+esc(a)+'"><td class="mono">'+esc(a)+'</td><td>'+pill(FSTAT,n.fstatus)+'</td><td class="num muted">'+fmtLag(n.lag)+'</td></tr>';}).join("")+'</tbody></table>'+
    (ps.last.error&&i.status!=="resolved"?'<h3 style="font-size:12px;margin:16px 0 8px">Latest error</h3><div class="err">'+esc(ps.last.error)+'</div>':'')+
    '</div><div><h3 style="font-size:12px;margin:0 0 10px">Timeline</h3><ul class="timeline">'+i.events.slice().sort(function(a,b){return a.t-b.t;}).map(function(e){return '<li class="k-'+e.k+'"><div class="when">'+fmtTime(e.t)+'</div><div>'+e.m+'</div></li>';}).join("")+'</ul>'+
    '<h3 style="font-size:12px;margin:6px 0 6px">Add note</h3><textarea id="note" placeholder="Share an update with responders…"></textarea><div style="margin-top:6px"><button class="btn" id="addNote">Post update</button></div></div></div>';
  host.innerHTML=h;
  function ev(k,m){i.events.push({t:Date.now(),k:k,m:m});}
  var a=el("ack");if(a)a.onclick=function(){i.status="acknowledged";i.assignee="you";ev("ack","Acknowledged by you");renderIncidents();};
  var r=el("res");if(r)r.onclick=function(){i.status="resolved";i.resolved=Date.now();ev("resolve","Resolved by you");renderIncidents();};
  var ro=el("reopen");if(ro)ro.onclick=function(){i.status="open";delete i.resolved;ev("detect","Reopened by you");renderIncidents();};
  el("addNote").onclick=function(){var v=el("note").value.trim();if(!v)return;ev("note","<b>you:</b> "+esc(v));renderIncDetail();};
  bindListLinks(host);
}

var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,150);});
render();
})();
</script>
